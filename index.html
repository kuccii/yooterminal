<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/images/yooterminal-mark.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {
          stored = null;
        }
        if (stored === 'dark') dark = true;
        else if (stored === 'light') dark = false;
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <title>YooTerminal &#8212; Cheap bus tickets in Uganda &amp; Rwanda</title>
    <meta
      name="description"
      content="Compare and book bus tickets across Uganda and Rwanda. Kampala to Kigali, Entebbe, Jinja, Mbarara, Musanze, Rubavu and more — instant e-tickets with secure payment."
    />
    <meta property="og:title" content="YooTerminal &#8212; Cheap bus tickets in Uganda &amp; Rwanda" />
    <meta
      property="og:description"
      content="Compare every coach operator between Uganda and Rwanda and book your seat in minutes."
    />
    <meta property="og:type" content="website" />
    <script src="https://checkout.flutterwave.com/v3.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
